<!DOCTYPE html>
<html lang="{{ page.lang | default: 'th' }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ page.title }}</title>
<meta name="description" content="{{ page.description }}">
<meta name="theme-color" content="#0075C1">
<meta property="og:title" content="{{ page.title }}">
<meta property="og:description" content="{{ page.description }}">
<meta property="og:type" content="website">
<meta property="og:image" content="https://img1.wsimg.com/isteam/ip/81960336-3dee-455b-8984-07d8ec07b61e/DSCF1600.JPG">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@500;600;700&family=Sarabun:wght@400;500;600&display=swap" rel="stylesheet">
{%- if page.alt_url %}
{%- if page.lang == 'en' %}{% assign th_url = page.alt_url %}{% assign en_url = page.url %}{% else %}{% assign th_url = page.url %}{% assign en_url = page.alt_url %}{% endif %}
<link rel="alternate" hreflang="th" href="{{ th_url | absolute_url }}">
<link rel="alternate" hreflang="en" href="{{ en_url | absolute_url }}">
<link rel="alternate" hreflang="x-default" href="{{ th_url | absolute_url }}">
{%- endif %}
<link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
</head>
<body>
{% include header.html %}
<main>
{{ content }}
</main>
{% include footer.html %}
</body>
</html>
